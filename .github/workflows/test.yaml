name: test
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        config: [Full, Lite, Tiny, Ultra-Tiny, Tiny-Serial, LNS]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Tools (iverilog, yosys)
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys gtkwave

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Gate Analysis
        if: matrix.config == 'Full'
        run: |
          python3 test/gate_analysis.py

      - name: Verify M3 Integration & Hybrid Co-Simulation (Unicorn + cocotb)
        if: matrix.config == 'Full'
        run: |
          sudo apt-get install -y gcc-arm-none-eabi
          pip install unicorn
          python3 test/verify_rtl.py
          python3 test/verify_rtl_m3.py
          # Verify AHB2 DMA bridge self-checking testbench
          iverilog -g2012 -Isrc -o m3_dma_tb src/project.v src/fp8_mul.v src/fp8_mul_lns.v src/fp8_mul_serial_lns.v src/fp8_aligner.v src/fp8_aligner_serial.v src/accumulator.v src/accumulator_serial.v src/lzc40.v src/fixed_to_float.v src_gowin/ahb2_mac_bridge.v test/tb_ahb2_mac_bridge.v
          vvp m3_dma_tb
          rm -f m3_dma_tb
          # Verify compilation of all M3 modes using iverilog
          for mode in M3_MODE_GPIO M3_MODE_APB M3_MODE_AHB M3_MODE_AHB_DMA; do
            echo "Verifying $mode..."
            iverilog -g2012 -Isrc -D$mode src/project.v src/fp8_mul.v src/fp8_mul_lns.v src/fp8_mul_serial_lns.v src/fp8_aligner.v src/fp8_aligner_serial.v src/accumulator.v src/accumulator_serial.v src/lzc40.v src/fixed_to_float.v src_gowin/tt_gowin_top_m3.v src_gowin/gowin_empu_m3_stub.v src_gowin/ahb2_mac_bridge.v -o m3_test
            rm m3_test
          done
          # Run ARM Cortex-M3 (Unicorn) + FPGA RTL (cocotb) co-simulation across all 4 modes
          make -C test -f Makefile_m3_cosim all_modes

      - name: Run Unit Test Suites
        if: matrix.config == 'Full'
        run: |
          cd test
          mkdir -p results
          for mf in Makefile_accumulator Makefile_accumulator_serial Makefile_aligner Makefile_aligner_serial Makefile_f2f Makefile_lzc40; do
            echo "Running $mf..."
            make -f "$mf" clean
            make -f "$mf"
          done

      - name: Run tests and generate individual waveforms
        run: |
          export COMPILE_ARGS=$(python3 scripts/configure_variant.py "${{ matrix.config }}" --format=iverilog)
          cd test
          bash run_tests.sh

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results/*.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.config }}
          path: |
            test/waveforms/*.fst
            test/waveforms/*.vcd
            test/results/*.xml
            test/output/*
